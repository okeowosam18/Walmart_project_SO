name: 'walmart_analytics'
version: '1.0.0'
config-version: 2

profile: 'walmart'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  walmart_analytics:
    # Staging layer - views only
    staging:
      +materialized: view
      +schema: staging
    # Marts layer - dimensional model
    marts:
      dim:
        +materialized: incremental
        +schema: analytics
        +on_schema_change: "append_new_columns"
      fact:
        +materialized: view
        +schema: analytics

# Snapshot configuration
snapshots:
  walmart_analytics:
    +target_database: walmart_db
    +target_schema: snapshots

vars:
  # Set your timezone
  timezone: 'America/Chicago'