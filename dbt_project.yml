name: 'walmart_analytics'
version: '1.0.0'
config-version: 2

profile: 'walmart'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  walmart_analytics:
    staging:
      +materialized: view
      +schema: staging
    dimensions:
      +materialized: incremental
      +schema: analytics
      +on_schema_change: "append_new_columns"
    fact:
      +materialized: incremental
      +schema: analytics
      +on_schema_change: "append_new_columns"

vars:
  # Set your timezone
  timezone: 'America/Chicago'

# Required packages
packages:
  - package: dbt-labs/dbt_utils
    version: 1.1.1